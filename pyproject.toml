[project]
name = "mc-dashboard"
version = "0.2.0"
description = "Minecraft Java 服务器状态面板"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.2",
    "jinja2>=3.1.6",
    "mcstatus>=14.2.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
