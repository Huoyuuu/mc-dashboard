services:
  mc-dashboard:
    image: ghcr.io/huoyuuu/mc-dashboard:latest
    build: .
    ports:
      - "${MC_DASH_BIND:-18000}:18000"  # 只给本机反向代理用时可在 .env 里写 MC_DASH_BIND=127.0.0.1:18000
    volumes:
      - ./data:/app/data
    environment:
      MC_DASH_TZ: Asia/Shanghai  # 页面显示时区，也用来解读旧版本存下的无时区时间
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18000/healthz')"]
      interval: 60s
      timeout: 10s
      start_period: 30s
