<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MC 服务器状态面板{% endblock %}</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    body {
      background: #fafaf9;
      background-image: radial-gradient(#e7e5e4 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .avatar { image-rendering: pixelated; }
    .hairline { border-color: #e4decf; }
    .num { font-variant-numeric: tabular-nums; }
    .fade-in { animation: fadeIn .25s ease-out; }
    .shadow-paper { box-shadow: 0 1px 2px rgba(38,34,28,.05), 0 4px 14px rgba(38,34,28,.06); }
    .bg-paper-50 { background-color: #fcfbf8; }
    .bg-paper-100 { background-color: #f7f5ef; }
    .bg-paper-150 { background-color: #f1eee5; }
    .bg-paper-200 { background-color: #eae5d8; }
    .text-paper-50 { color: #fcfbf8; }
    .text-ink { color: #26221c; }
    .text-ink-soft { color: #5a544a; }
    .text-ink-faint { color: #92897a; }
    .bg-ink { background-color: #26221c; }
    .bg-seal { background-color: #a4443c; }
    .bg-moss-wash { background-color: #eef3ec; }
    .text-moss { color: #437051; }
    .border-moss-line { border-color: #cbdcc8; }
    .bg-moss { background-color: #437051; }
    .bg-rust-wash { background-color: #f8eee8; }
    .text-rust { color: #a8503a; }
    .border-rust-line { border-color: #e8cfc0; }
    .bg-rust { background-color: #a8503a; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body class="min-h-screen text-stone-800 antialiased">
  <header class="sticky top-0 z-10 border-b border-stone-200/80 bg-white/85 backdrop-blur">
    <div class="mx-auto max-w-5xl px-6 py-4 flex items-center gap-3">
      <span class="grid place-items-center w-9 h-9 rounded-xl bg-stone-900 text-white shadow-sm">
        <i data-lucide="box" class="w-5 h-5"></i>
      </span>
      <a href="/" class="text-lg font-semibold tracking-tight">MC 服务器状态面板</a>
      <span class="ml-auto inline-flex items-center gap-1.5 text-xs text-stone-500 bg-white border border-stone-200 rounded-full px-3 py-1.5 shadow-sm">
        <span class="relative flex w-2 h-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-60"></span>
          <span class="relative inline-flex rounded-full w-2 h-2 bg-emerald-500"></span>
        </span>
        每 60 秒自动轮询
      </span>
    </div>
  </header>
  <main class="mx-auto max-w-5xl px-6 py-8">
    {% block content %}{% endblock %}
  </main>
  <script>
    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, function (c) {
        return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
      });
    }
    function fmtDT(value) {
      if (!value) return '—';
      const d = new Date(String(value).replace(' ', 'T'));
      return Number.isNaN(d.getTime()) ? value : d.toLocaleString('zh-CN', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' });
    }
    function fmtT(value) {
      if (!value) return '—';
      const d = new Date(String(value).replace(' ', 'T'));
      return Number.isNaN(d.getTime()) ? value : d.toLocaleString('zh-CN', { hour:'2-digit', minute:'2-digit' });
    }
    function avatarHTML(name, sizeCls) {
      const n = esc(name);
      return '<span class="inline-flex items-center justify-center overflow-hidden bg-paper-200 text-ink-soft rounded ' + sizeCls + '">' +
        '<img src="https://mc-heads.net/avatar/' + encodeURIComponent(name) + '/64" alt="' + n + '" loading="lazy" class="w-full h-full" style="image-rendering:pixelated" onerror="this.remove()">' +
        '</span>';
    }
    function playerChip(name) {
      return '<span class="inline-flex items-center gap-1.5 pl-1 pr-2 py-1 rounded border hairline bg-paper-50">' +
        avatarHTML(name, 'w-[18px] h-[18px]') + '<span class="font-mono text-xs">' + esc(name) + '</span></span>';
    }
    function chip(online) {
      return online
        ? '<span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-moss-wash text-moss border border-moss-line"><span class="w-1.5 h-1.5 rounded-full bg-moss animate-pulse"></span>在线</span>'
        : '<span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-rust-wash text-rust border border-rust-line"><span class="w-1.5 h-1.5 rounded-full bg-rust"></span>离线</span>';
    }
    function paperOpts(o) {
      o = o || {};
      return {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: o.legend ? { display: true, position: 'top', align: 'end', labels: { color: '#5A544A', boxWidth: 18, boxHeight: 2, font: { size: 11 } } } : { display: false },
          tooltip: { backgroundColor: '#26221C', titleColor: '#F7F5EF', bodyColor: '#EAE5D8', cornerRadius: 4, padding: 8, displayColors: false }
        },
        scales: {
          x: { grid: { display: false }, border: { color: '#DCD5C2' }, ticks: { color: '#92897A', font: { size: 10 }, maxTicksLimit: 8, maxRotation: 0 } },
          y: { beginAtZero: true, grid: { color: '#F1EEE5' }, border: { display: false }, ticks: { color: '#92897A', font: { size: 10 }, precision: 0 } }
        }
      };
    }
    function refreshIcons() { if (window.lucide) lucide.createIcons(); }
    refreshIcons();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
