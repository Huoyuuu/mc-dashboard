<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MC 服务器状态面板{% endblock %}</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    body {
      background: #fafaf9;
      background-image: radial-gradient(#e7e5e4 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .avatar { image-rendering: pixelated; }
  </style>
</head>
<body class="min-h-screen text-stone-800 antialiased">
  <header class="sticky top-0 z-10 border-b border-stone-200/80 bg-white/85 backdrop-blur">
    <div class="mx-auto max-w-5xl px-6 py-4 flex items-center gap-3">
      <span class="grid place-items-center w-9 h-9 rounded-xl bg-stone-900 text-white shadow-sm">
        <i data-lucide="box" class="w-5 h-5"></i>
      </span>
      <a href="/" class="text-lg font-semibold tracking-tight">MC 服务器状态面板</a>
      <span class="ml-auto inline-flex items-center gap-1.5 text-xs text-stone-500 bg-white border border-stone-200 rounded-full px-3 py-1.5 shadow-sm">
        <span class="relative flex w-2 h-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-60"></span>
          <span class="relative inline-flex rounded-full w-2 h-2 bg-emerald-500"></span>
        </span>
        每 60 秒自动轮询
      </span>
    </div>
  </header>
  <main class="mx-auto max-w-5xl px-6 py-8">
    {% block content %}{% endblock %}
  </main>
  <script>lucide.createIcons();</script>
  {% block scripts %}{% endblock %}
</body>
</html>
