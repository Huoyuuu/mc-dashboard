<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MC 服务器状态面板{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/vendor/lucide.min.js"></script>
  <style>
    :root { --paper: #faf9f5; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      background: var(--paper);
      background-image: radial-gradient(#e9e5da 1px, transparent 1px);
      background-size: 22px 22px;
      font-feature-settings: "cv11", "ss01";
    }
    .font-serif { font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", ui-serif, Georgia, serif; }
    .font-mono, .num { font-family: "JetBrains Mono", "Cascadia Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .avatar { image-rendering: pixelated; }
    .num { font-variant-numeric: tabular-nums; }
    .fade-in { animation: fadeIn .28s cubic-bezier(.2,.7,.2,1) both; }
    .shadow-paper { box-shadow: 0 1px 2px rgba(38,34,28,.04), 0 6px 18px rgba(38,34,28,.05); }
    .shadow-paper-lg { box-shadow: 0 2px 6px rgba(38,34,28,.05), 0 16px 40px rgba(38,34,28,.08); }
    .press { transition: transform .12s ease, box-shadow .2s ease, background-color .2s ease, border-color .2s ease, color .2s ease; }
    .press:active { transform: translateY(1px) scale(.99); }
    .lift { transition: transform .18s cubic-bezier(.2,.7,.2,1), box-shadow .2s ease, border-color .2s ease; }
    .lift:hover { transform: translateY(-2px); }
    .field { transition: border-color .15s ease, box-shadow .15s ease, background-color .15s ease; }
    .field:focus-visible { outline: none; border-color: #b9b09a; box-shadow: 0 0 0 3px rgba(164,68,60,.10); background-color: #fff; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .fade-in { animation: none; } }
    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #ded7c5; border-radius: 10px; border: 2px solid var(--paper); }
    ::-webkit-scrollbar-thumb:hover { background: #cdc4ad; }
    * { scrollbar-width: thin; scrollbar-color: #ded7c5 transparent; }
  </style>
</head>
<body class="min-h-screen text-ink antialiased">
  <header class="sticky top-0 z-20 border-b hairline bg-[#fcfbf8]/80 backdrop-blur-md">
    <div class="mx-auto max-w-5xl px-6 py-3.5 flex items-center gap-3">
      <a href="/" class="flex items-center gap-3 group">
        <span class="grid place-items-center w-9 h-9 rounded-xl bg-ink text-paper-50 shadow-paper press">
          <i data-lucide="box" class="w-5 h-5"></i>
        </span>
        <span class="font-serif text-lg font-semibold tracking-tight leading-none">MC 服务器状态面板</span>
      </a>
      <span class="ml-auto inline-flex items-center gap-1.5 text-xs text-ink-soft bg-paper-50 border hairline rounded-full px-3 py-1.5 shadow-paper">
        <span class="relative flex w-2 h-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-moss opacity-50"></span>
          <span class="relative inline-flex rounded-full w-2 h-2 bg-moss"></span>
        </span>
        每 {{ poll_interval }} 秒自动巡查
      </span>
    </div>
  </header>
  <main class="mx-auto max-w-5xl px-6 py-8">
    {% block content %}{% endblock %}
  </main>
  <footer class="mx-auto max-w-5xl px-6 pb-10 text-center text-xs text-ink-faint">
    纸白监控台 · Minecraft Java 服务器 · mcstatus
  </footer>
  <script>
    const TZ = {{ tz | tojson }};
    // 库里的时间都是 UTC（结尾 Z），统一按 TZ 显示；不带时区的旧格式按 UTC 处理
    function toDate(value) {
      if (!value) return null;
      let s = String(value).replace(' ', 'T');
      if (!/(Z|[+-]\d\d:?\d\d)$/.test(s)) s += 'Z';
      const d = new Date(s);
      return Number.isNaN(d.getTime()) ? null : d;
    }
    function fmt(value, opts) {
      const d = toDate(value);
      return d ? d.toLocaleString('zh-CN', Object.assign({ timeZone: TZ, hour12: false }, opts)) : (value || '—');
    }
    function fmtDT(value) { return fmt(value, { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }); }
    function fmtT(value) { return fmt(value, { hour: '2-digit', minute: '2-digit' }); }
    function fmtFull(value) { const d = toDate(value); return d ? d.toLocaleString('sv-SE', { timeZone: TZ }) : (value || '—'); }
    // TZ 下的 [星期(0=周日), 小时]，热力图用
    function wdHour(value) {
      const parts = new Intl.DateTimeFormat('en-US', { timeZone: TZ, weekday: 'short', hour: 'numeric', hourCycle: 'h23' }).formatToParts(toDate(value));
      const get = t => parts.find(p => p.type === t).value;
      return [['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(get('weekday')), +get('hour')];
    }
    function fmtDur(sec) {
      const m = Math.round(sec / 60);
      if (m < 1) return '不到 1 分';
      if (m < 60) return m + ' 分';
      const h = Math.floor(m / 60);
      return h < 48 ? h + ' 小时' + (m % 60 ? ' ' + (m % 60) + ' 分' : '') : (h / 24).toFixed(1) + ' 天';
    }
    function fmtRel(value) {
      const d = toDate(value);
      if (!d) return '';
      const sec = Math.round((Date.now() - d.getTime()) / 1000);
      if (sec < 0 || sec > 30 * 86400) return '';
      if (sec < 60) return '刚刚';
      if (sec < 3600) return Math.floor(sec / 60) + ' 分钟前';
      if (sec < 86400) return Math.floor(sec / 3600) + ' 小时前';
      return Math.floor(sec / 86400) + ' 天前';
    }
    // 服务端只输出 UTC 原始值：data-ts（data-fmt=full|dt|t）、data-dur（秒）、data-reltime
    function applyTimes() {
      const fns = { full: fmtFull, dt: fmtDT, t: fmtT };
      document.querySelectorAll('[data-ts]').forEach(function (el) {
        el.textContent = (fns[el.dataset.fmt] || fmtFull)(el.dataset.ts);
      });
      document.querySelectorAll('[data-dur]').forEach(function (el) { el.textContent = fmtDur(+el.dataset.dur); });
      document.querySelectorAll('[data-reltime]').forEach(function (el) {
        const rel = fmtRel(el.getAttribute('data-reltime'));
        el.textContent = rel ? '（' + rel + '）' : '';
      });
    }
    // 用新拉到的整页 HTML 替换 #live 区域，不整页刷新
    function swapLive(html) {
      const next = new DOMParser().parseFromString(html, 'text/html').getElementById('live');
      const live = document.getElementById('live');
      if (!next || !live) return location.reload();
      next.querySelectorAll('.fade-in').forEach(el => el.classList.remove('fade-in'));
      live.innerHTML = next.innerHTML;
      refreshIcons();
      applyTimes();
    }
    // 定时局部刷新：页面隐藏或用户正在输入时跳过，等下一轮再试
    function autoRefresh(seconds) {
      let last = Date.now();
      setInterval(function () {
        if (Date.now() - last < seconds * 1000) return;
        const el = document.activeElement;
        const typing = el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable);
        if (document.hidden || typing) return;
        last = Date.now();
        fetch(location.href, { cache: 'no-store' }).then(r => r.text()).then(swapLive).catch(() => {});
      }, 5000);
    }
    // data-ajax 表单：后台提交，按钮显示"查询中"，结果回来后局部替换（303 跳转后的页面就是新内容）
    document.addEventListener('submit', function (e) {
      const form = e.target;
      if (!form.hasAttribute('data-ajax')) return;
      e.preventDefault();
      const btn = form.querySelector('button');
      const label = btn.innerHTML;
      btn.disabled = true;
      btn.textContent = '查询中…';
      fetch(form.action, { method: 'POST', body: new FormData(form) })
        .then(r => r.text()).then(swapLive)
        .finally(function () { btn.disabled = false; btn.innerHTML = label; refreshIcons(); });
    });
    // 一键复制：http + IP 访问时没有 navigator.clipboard，回退到 execCommand
    document.addEventListener('click', function (e) {
      const btn = e.target.closest('[data-copy]');
      if (!btn) return;
      e.preventDefault();
      e.stopPropagation();
      const text = btn.dataset.copy;
      const fallback = function () {
        const ta = Object.assign(document.createElement('textarea'), { value: text });
        ta.style.cssText = 'position:fixed;opacity:0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
      };
      (navigator.clipboard ? navigator.clipboard.writeText(text).catch(fallback) : Promise.resolve(fallback()))
        .then(function () {
          btn.innerHTML = '<i data-lucide="check" class="w-3.5 h-3.5"></i>';
          refreshIcons();
          setTimeout(function () { btn.innerHTML = '<i data-lucide="copy" class="w-3.5 h-3.5"></i>'; refreshIcons(); }, 1500);
        });
    });
    function paperOpts(o) {
      o = o || {};
      return {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: o.legend ? { display: true, position: 'top', align: 'end', labels: { color: '#5A544A', boxWidth: 18, boxHeight: 2, font: { size: 11 } } } : { display: false },
          tooltip: { backgroundColor: '#26221C', titleColor: '#F7F5EF', bodyColor: '#EAE5D8', cornerRadius: 6, padding: 10, displayColors: false }
        },
        scales: {
          x: { grid: { display: false }, border: { color: '#DCD5C2' }, ticks: { color: '#7A7264', font: { size: 10 }, maxTicksLimit: 8, maxRotation: 0 } },
          y: { beginAtZero: true, grid: { color: '#F1EEE5' }, border: { display: false }, ticks: { color: '#7A7264', font: { size: 10 }, precision: 0 } }
        }
      };
    }
    // 热力图：cells 为 [[UTC 时间, 数值], ...]，按 TZ 聚合到 7×24 格（默认取平均，total 时累加），值越大颜色越深
    const HEAT = ['#f1eee5', '#d5e2d1', '#a6c3a3', '#6f9877', '#437051', '#2c4b36'];
    function renderHeat(el, cells, unit, total) {
      const sum = Array.from({ length: 7 }, () => Array(24).fill(0)), cnt = Array.from({ length: 7 }, () => Array(24).fill(0));
      cells.forEach(function (c) { const [d, h] = wdHour(c[0]); sum[d][h] += c[1]; cnt[d][h] += 1; });
      const avg = total ? sum : sum.map((r, d) => r.map((v, h) => cnt[d][h] ? v / cnt[d][h] : 0));
      const max = Math.max(0, ...avg.flat());
      const names = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
      let html = '<div class="grid gap-[3px]" style="grid-template-columns:2.5rem repeat(24,minmax(0,1fr))">';
      [1, 2, 3, 4, 5, 6, 0].forEach(function (d) {
        html += '<span class="text-[10px] text-ink-faint leading-none self-center">' + names[d] + '</span>';
        for (let h = 0; h < 24; h++) {
          const v = avg[d][h], lv = v > 0 && max > 0 ? Math.min(5, 1 + Math.floor(v / max * 4.999)) : 0;
          html += '<span class="aspect-square rounded-[3px]" style="background:' + HEAT[lv] + '" title="' + names[d] + ' ' + h + ' 点 · ' + unit(v) + '"></span>';
        }
      });
      html += '<span></span>';
      for (let h = 0; h < 24; h++) html += '<span class="text-[9px] text-ink-faint text-center num">' + (h % 3 ? '' : h) + '</span>';
      el.innerHTML = html + '</div>';
    }
    function refreshIcons() { if (window.lucide) lucide.createIcons(); }
    refreshIcons();
    applyTimes();
    setInterval(applyTimes, 30000);
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
